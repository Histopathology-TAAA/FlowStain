[project]
name = "flowstain"
version = "0.1.0"
description = "Source-anchored rectified flow for H&E to IHC virtual staining."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch==2.10.*",
    "torchvision==0.25.*",
    "accelerate>=0.28",
    "diffusers>=0.27",
    "transformers>=4.38",
    "timm>=0.9",
    "einops>=0.7",
    "lpips>=0.1.4",
    "torchmetrics>=1.2",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "Pillow>=10.0",
    "numpy>=1.24",
    "tqdm",
    "wandb",
    "omegaconf>=2.3",
    "pytorch-fid>=0.3",
    "open-clip-torch>=2.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flowstain"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
